<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨️الرفيق اليومي✨️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body>

    <!-- شاشة الترحيب (Intro Splash Screen) -->
    <div id="intro-screen">
        <div class="intro-content">
            <h1 class="glow-text">✨️الرفيق اليومي✨️</h1>
            <p>رفيقك لكل عبادة، صلاة، وتسبيح، وذكر</p>
        </div>
    </div>

    <!-- المحتوى الرئيسي للموقع -->
    <div class="main-container" id="main-content">
        
        <header>
            <h1>✨️الرفيق اليومي✨️</h1>
            <p>اجعل لسانك رطباً بذكر الله</p>
            <!-- زر تفعيل إشعارات الصلاة -->
            <button id="notify-permission-btn" class="gold-btn" style="margin-top: 10px;">تفعيل إشعارات الصلوات 🔔</button>
        </header>

        <div class="grid-layout">

            <!-- مواقيت الصلاة ومتتبع الصلوات -->
            <section class="card">
                <h2>مواقيت الصلاة اليوم</h2>
                <div id="next-prayer-box" class="next-prayer">جارِ تحميل مواقيت الصلاة...</div>
                <div class="prayer-tracker">
                    <h3>متتبع الصلوات اليومية</h3>
                    <ul id="prayer-list">
                        <li><span>الفجر</span><button class="pray-btn" data-prayer="Fajr">لم تُصلى</button></li>
                        <li><span>الظهر</span><button class="pray-btn" data-prayer="Dhuhr">لم تُصلى</button></li>
                        <li><span>العصر</span><button class="pray-btn" data-prayer="Asr">لم تُصلى</button></li>
                        <li><span>المغرب</span><button class="pray-btn" data-prayer="Maghrib">لم تُصلى</button></li>
                        <li><span>العشاء</span><button class="pray-btn" data-prayer="Isha">لم تُصلى</button></li>
                    </ul>
                </div>
            </section>

            <!-- السبحة الإلكترونية -->
            <section class="card misbaha-section">
                <h2>السبحة الإلكترونية</h2>
                <div class="dhikr-selector">
                    <label for="dhikr-select">اختر الذكر:</label>
                    <select id="dhikr-select">
                        <option value="سبحان الله">سبحان الله</option>
                        <option value="الحمد لله">الحمد لله</option>
                        <option value="لا إله إلا الله">لا إله إلا الله</option>
                        <option value="الله أكبر">الله أكبر</option>
                        <option value="استغفر الله">استغفر الله</option>
                    </select>
                </div>
                <div class="counter-display" id="counter-display">0</div>
                <div class="misbaha-buttons">
                    <button id="count-btn" class="gold-btn">تسبيح</button>
                    <button id="reset-btn" class="outline-btn">إعادة تعيين</button>
                </div>
            </section>

            <!-- القرآن الكريم -->
            <!-- استبدلي قسم القرآن الكريم في ملف index.html بهذا الكود -->
<section class="card quran-section">
    <h2>القرآن الكريم</h2>
    <div class="quran-controls">
        <select id="surah-select">
            <option value="">اختر السورة للقراءة...</option>
        </select>
        <button id="load-surah-btn" class="gold-btn">قراءة السورة</button>
    </div>
    
    <div id="bookmark-info" class="bookmark-badge"></div>
</section>

        </div>

        <footer>
            <p>صُمم بكل حب ليرافقك في طاعتك ✨️</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
