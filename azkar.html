<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأذكار - ✨️الرفيق اليومي✨️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 20px; }
        .azkar-header {
            display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px;
        }
        .back-btn { background-color: var(--primary-green); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .azkar-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .zekr-card {
            background-color: var(--card-bg); border-radius: 12px; padding: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border-color);
            text-align: center;
        }
        .zekr-text { font-size: 1.4rem; line-height: 2; margin-bottom: 15px; color: var(--text-dark); }
        .zekr-count {
            display: inline-block; background-color: var(--gold); color: white;
            padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;
            user-select: none;
        }
        .zekr-count.done { background-color: var(--primary-green); }
    </style>
</head>
<body>

    <script>
        // Check Theme
        if(localStorage.getItem("app_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>

    <div class="azkar-header">
        <h1 id="azkar-title">الأذكار</h1>
        <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </div>

    <div id="azkar-container" class="azkar-container">
        <!-- Azkar will be loaded here -->
    </div>

    <script>
        const morningAzkar = [
            { text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1 },
            { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", count: 1 },
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", count: 100 }
        ];

        const eveningAzkar = [
            { text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ.", count: 1 },
            { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.", count: 1 },
            { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", count: 100 }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const titleElem = document.getElementById("azkar-title");
            const container = document.getElementById("azkar-container");

            let azkarList = [];
            if (type === "morning") {
                titleElem.textContent = "أذكار الصباح ☀️";
                azkarList = morningAzkar;
            } else if (type === "evening") {
                titleElem.textContent = "أذكار المساء 🌙";
                azkarList = eveningAzkar;
            } else {
                titleElem.textContent = "خطأ";
                container.innerHTML = "<p>نوع الأذكار غير محدد.</p>";
                return;
            }

            azkarList.forEach(zekr => {
                let currentCount = zekr.count;
                const card = document.createElement("div");
                card.className = "zekr-card";
                
                const textElem = document.createElement("div");
                textElem.className = "zekr-text";
                textElem.textContent = zekr.text;
                
                const countBtn = document.createElement("div");
                countBtn.className = "zekr-count";
                countBtn.textContent = `التكرار: ${currentCount}`;
                
                countBtn.addEventListener("click", () => {
                    if (currentCount > 0) {
                        currentCount--;
                        if (currentCount === 0) {
                            countBtn.textContent = "تم ✓";
                            countBtn.classList.add("done");
                            // Update streak when any zekr is done
                            updateStreakActivityLocally();
                        } else {
                            countBtn.textContent = `التكرار: ${currentCount}`;
                        }
                    }
                });

                card.appendChild(textElem);
                card.appendChild(countBtn);
                container.appendChild(card);
            });
        });

        function updateStreakActivityLocally() {
            const todayStr = new Date().toISOString().split('T')[0];
            const lastActiveDate = localStorage.getItem("last_active_date");
            let streak = parseInt(localStorage.getItem("streak_count")) || 0;

            if (lastActiveDate !== todayStr) {
                if (lastActiveDate) {
                    const lastDate = new Date(lastActiveDate);
                    const today = new Date(todayStr);
                    const diffTime = Math.abs(today - lastDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    if (diffDays === 1) streak++;
                    else if (diffDays > 1) streak = 1;
                } else {
                    streak = 1;
                }
                localStorage.setItem("streak_count", streak);
                localStorage.setItem("last_active_date", todayStr);
            }
        }
    </script>
</body>
</html>
